# Local Kafka-compatible broker for development.
# Redpanda speaks the Kafka API, so the exact same client code runs against
# Confluent Cloud in production — only .env changes.
#
#   docker compose up -d       # start
#   docker compose down -v      # stop and wipe data
services:
  redpanda:
    image: redpandadata/redpanda:v24.2.7
    container_name: wikipulse-redpanda
    command:
      - redpanda
      - start
      - --mode=dev-container
      - --smp=1
      - --default-log-level=warn
      # Two listeners: internal (docker network) and external (host apps on :19092)
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr=internal://redpanda:9092,external://localhost:19092
    ports:
      - "19092:19092"   # Kafka API for host apps (matches .env.example)
      - "9644:9644"     # Admin API
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy:.*true'"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Optional web UI to eyeball topics/messages at http://localhost:8080
  console:
    image: redpandadata/console:v2.7.2
    container_name: wikipulse-console
    depends_on:
      redpanda:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      KAFKA_BROKERS: redpanda:9092
